<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="512" height="512" role="img" aria-labelledby="apertux-icon-title apertux-icon-desc">
  <title id="apertux-icon-title">apertux icon</title>
  <desc id="apertux-icon-desc">Dual-Chevron Spark X mark representing two NVIDIA DGX Sparks coupled across a 200GbE link.</desc>
  <style>
    :root {
      --apertux-surface: #FAF9F6;
      --apertux-border: #E2E0D8;
      --apertux-ink: #13171C;
      --apertux-accent: #E02D24;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --apertux-surface: #13171C;
        --apertux-border: #2B313A;
        --apertux-ink: #F5F6F8;
        --apertux-accent: #FF4D42;
      }
    }
  </style>
  <rect x="4" y="4" width="172" height="172" rx="38" fill="var(--apertux-surface)" stroke="var(--apertux-border)" stroke-width="2" />
  <g transform="translate(26, 20)" fill="none" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 8 8 L 64 51 L 120 8" stroke="var(--apertux-ink)" />
    <path d="M 8 132 L 64 89 L 120 132" stroke="var(--apertux-ink)" />
    <line x1="34" y1="70" x2="94" y2="70" stroke="var(--apertux-accent)" />
  </g>
</svg>
